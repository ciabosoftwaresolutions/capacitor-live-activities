name: CI

on:
  # Manually triggered from GitHub → Actions → CI → Run workflow
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24  # Upgraded to Node 24 for proper npm OIDC support
          cache: npm
      - run: npm ci
      - run: npm run build

  publish:
    # Only runs when manually triggered via workflow_dispatch
    if: github.event_name == 'workflow_dispatch'
    needs: [build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push version commit + tag back to repo
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24  # Upgraded to Node 24
          cache: npm        # REMOVED registry-url so it doesn't break OIDC

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - run: npm ci
      - run: npm run build

      - name: Bump version
        run: 'npm version ${{ github.event.inputs.release_type }} -m "chore: release v%s"'

      - name: Push version commit and tag
        run: git push --follow-tags

      - name: Publish to npm
        run: npm publish --access public