name: CI

on:
  push:
    branches: [master]
  pull_request:

  # Manually triggered from GitHub → Actions → Publish → Run workflow
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cd android && ./gradlew build

  publish:
    # Only runs when manually triggered via workflow_dispatch
    if: github.event_name == 'workflow_dispatch'
    needs: [build-web, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push the version commit + tag back to the repo
      id-token: write  # needed for OIDC Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a PAT so the version commit can trigger status checks.
          # Falls back to GITHUB_TOKEN if the secret isn't set (commit
          # will still push but won't re-trigger workflows).
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - run: npm ci
      - run: npm run build

      - name: Bump version
        run: npm version ${{ github.event.inputs.release_type }} -m "chore: release v%s"

      - name: Push version commit and tag
        run: git push --follow-tags

      - name: Publish to npm
        run: npm publish --access public --provenance
